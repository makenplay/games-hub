             border:1px dashed #33406b; border-radius:8px; color:#5b6b96; font-size:12px; letter-spacing:2px; background:#0e1530; overflow:hidden; }

  .btn { background:linear-gradient(180deg,#22c55e,#15803d); color:#fff; border:none; border-radius:10px; padding:11px 26px;

  .controls { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; justify-content:center; }

<script>
(function(){
  "use strict";
  var COLS = 21, ROWS = 21, CELL = 20;
  var canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best'), levelEl = document.getElementById('level');
  var overlay = document.getElementById('overlay'), ovTitle = document.getElementById('ov-title'), ovText = document.getElementById('ov-text');
  var startBtn = document.getElementById('startBtn');
  var snake, dir, nextDir, food, bonus, bonusTimer, score, best, level, speed, tickMs, timer, running, paused, soundOn;
  best = parseInt(localStorage.getItem('snake_best') || '0', 10) || 0;
  bestEl.textContent = best;
  soundOn = true;

  var AC = null;
  function beep(freq, dur, type){
    if(!soundOn) return;
    try{
      if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.06, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(AC.currentTime + dur);
    }catch(e){}
  }

  function randCell(){
    while(true){
      var c = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
      var hit = snake.some(function(s){ return s.x===c.x && s.y===c.y; });
      if(!hit && !(food && food.x===c.x && food.y===c.y)) return c;
    }
  }

  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0}; nextDir = dir;
    score = 0; level = 1; tickMs = 150;
    food = randCell(); bonus = null; bonusTimer = 0;
    scoreEl.textContent = '0'; levelEl.textContent = '1';
    draw();
  }

  function draw(){
    ctx.fillStyle = '#0e1530'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1;
    for(var i=1;i<COLS;i++){ ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke(); }
    for(var j=1;j<ROWS;j++){ ctx.beginPath(); ctx.moveTo(0,j*CELL); ctx.lineTo(canvas.width,j*CELL); ctx.stroke(); }
    // food
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(food.x*CELL+10, food.y*CELL+10, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fca5a5';
    ctx.beginPath(); ctx.arc(food.x*CELL+7, food.y*CELL+7, 2.5, 0, Math.PI*2); ctx.fill();
    // bonus
    if(bonus){
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath(); ctx.arc(bonus.x*CELL+10, bonus.y*CELL+10, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff7ed'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
      ctx.fillText('★', bonus.x*CELL+10, bonus.y*CELL+14);
    }
    // snake
    snake.forEach(function(s, idx){
      var g = ctx.createLinearGradient(s.x*CELL, s.y*CELL, s.x*CELL+CELL, s.y*CELL+CELL);
      if(idx===0){ g.addColorStop(0,'#86efac'); g.addColorStop(1,'#22c55e'); }
      else { g.addColorStop(0,'#4ade80'); g.addColorStop(1,'#16a34a'); }
      ctx.fillStyle = g;
      ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
      if(idx===0){
        ctx.fillStyle = '#052e12';
        var ex = dir.x, ey = dir.y;
        ctx.beginPath(); ctx.arc(s.x*CELL+10+ex*3-3, s.y*CELL+10+ey*3-3, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(s.x*CELL+10+ex*3+3, s.y*CELL+10+ey*3+3, 2, 0, Math.PI*2); ctx.fill();
      }
    });
  }

  function step(){
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if(head.x<0 || head.y<0 || head.x>=COLS || head.y>=ROWS ||
       snake.some(function(s){ return s.x===head.x && s.y===head.y; })){
      gameOver(); return;
    }
    snake.unshift(head);
    if(head.x===food.x && head.y===food.y){
      score += 10; beep(660, 0.08);
      food = randCell();
      if(score % 50 === 0 && !bonus){ bonus = randCell(); bonusTimer = 40; }
      var newLevel = Math.floor(score/100) + 1;
      if(newLevel !== level){ level = newLevel; levelEl.textContent = level; tickMs = Math.max(70, 150 - (level-1)*12); restartTimer(); beep(880, 0.12, 'triangle'); }
    } else if(bonus && head.x===bonus.x && head.y===bonus.y){
      score += 50; beep(990, 0.15, 'triangle'); bonus = null;
    } else {
      snake.pop();
    }
    if(bonus){ bonusTimer--; if(bonusTimer<=0) bonus = null; }
    scoreEl.textContent = score;
    draw();
  }

  function restartTimer(){ if(timer) clearInterval(timer); timer = setInterval(step, tickMs); }
  function start(){
    reset(); running = true; paused = false;
    overlay.style.display = 'none';
    restartTimer(); beep(520, 0.08, 'triangle');
  }
  function gameOver(){
    running = false; if(timer) clearInterval(timer);
    beep(160, 0.35, 'sawtooth');
    if(score > best){ best = score; localStorage.setItem('snake_best', String(best)); bestEl.textContent = best; }
    ovTitle.textContent = 'Game Over!';
    ovText.textContent = 'Your score: ' + score + '  ·  Best: ' + best;
    startBtn.textContent = '↻ PLAY AGAIN';
    overlay.style.display = 'flex';
  }
  function togglePause(){
    if(!running) return;
    paused = !paused;
    if(paused){ if(timer) clearInterval(timer); ovTitle.textContent = 'Paused'; ovText.textContent = 'Tap Resume to continue.'; startBtn.textContent = '▶ RESUME'; overlay.style.display = 'flex'; }
    else { overlay.style.display = 'none'; restartTimer(); }
  }

  function setDir(x, y){
    if(x === -dir.x && y === -dir.y) return;
    if(x === dir.x && y === dir.y) return;
    nextDir = {x:x, y:y};
  }
  document.addEventListener('keydown', function(e){
    var k = e.key;
    if(k==='ArrowUp' || k==='w' || k==='W'){ setDir(0,-1); e.preventDefault(); }
    else if(k==='ArrowDown' || k==='s' || k==='S'){ setDir(0,1); e.preventDefault(); }
    else if(k==='ArrowLeft' || k==='a' || k==='A'){ setDir(-1,0); e.preventDefault(); }
    else if(k==='ArrowRight' || k==='d' || k==='D'){ setDir(1,0); e.preventDefault(); }
    else if(k===' ' || k==='p' || k==='P'){ togglePause(); e.preventDefault(); }
  });
  document.querySelectorAll('.dpad button').forEach(function(b){
    b.addEventListener('touchstart', function(e){ e.preventDefault(); var d=b.getAttribute('data-dir');
      if(d==='up') setDir(0,-1); else if(d==='down') setDir(0,1); else if(d==='left') setDir(-1,0); else setDir(1,0);
    }, {passive:false});
    b.addEventListener('mousedown', function(){ var d=b.getAttribute('data-dir');
      if(d==='up') setDir(0,-1); else if(d==='down') setDir(0,1); else if(d==='left') setDir(-1,0); else setDir(1,0);
    });
  });
  var tx=0, ty=0;
  canvas.addEventListener('touchstart', function(e){ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
  canvas.addEventListener('touchmove', function(e){
    e.preventDefault();
    var dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
    if(Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if(Math.abs(dx) > Math.abs(dy)) setDir(dx>0?1:-1, 0); else setDir(0, dy>0?1:-1);
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive:false});

  startBtn.addEventListener('click', function(){ if(paused){ togglePause(); } else { start(); } });
  document.getElementById('restartBtn').addEventListener('click', start);
  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.getElementById('soundBtn').addEventListener('click', function(){ soundOn = !soundOn; this.textContent = soundOn ? '🔊 Sound: On' : '🔇 Sound: Off'; });

  reset();
})();
</script>
