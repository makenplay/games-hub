<meta name="description" content="Play police car chase free online. Hunt down the robber car, ram it to bust it and don't let it escape. No download — Maken Play.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { background:#070b18; color:#e8ecf8; font-family:'Segoe UI', Arial, sans-serif; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  .brand { padding:10px 0 2px; font-size:14px; letter-spacing:3px; color:#7dd3fc; font-weight:700; }
  .brand b { color:#f472b6; }
  h1 { font-size:clamp(22px,4.5vw,32px); font-weight:900; margin:2px 0 4px; }
  .hud { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:6px 0; }
  .stat { background:#0e1530; border:1px solid #26335f; border-radius:8px; padding:5px 13px; font-size:12.5px; color:#9aa7c7; }
  .stat b { color:#fff; font-size:15px; }
  canvas#cv { background:linear-gradient(180deg,#101d38 0%,#1b3260 55%,#0a0f22 100%); border:2px solid #26335f; border-radius:12px; display:block; touch-action:none; max-width:94vw; height:auto; }
  #msg { min-height:20px; font-size:14px; color:#fbbf24; font-weight:700; text-align:center; padding:4px 8px; }
  .row { display:flex; gap:8px; justify-content:center; padding:2px 0 5px; flex-wrap:wrap; }
  .btn { padding:9px 16px; font-size:13.5px; font-weight:700; border:none; border-radius:9px; cursor:pointer; background:#1e2a4a; color:#dbe6ff; }
  .btn:active { transform:scale(.96); }
  .btn.primary { background:linear-gradient(90deg,#0ea5e9,#8b5cf6); color:#fff; }
  .pad { display:none; gap:8px; justify-content:center; padding:2px 0 6px; }
  .pad button { width:58px; height:50px; font-size:20px; border-radius:12px; border:1px solid #26335f; background:#101a3d; color:#fff; cursor:pointer; }
  @media (pointer:coarse) { .pad { display:flex; } }
  .keys { font-size:12px; color:#5b6b96; text-align:center; padding:2px 10px 10px; }
</style>
</head>
<body>
<div class="brand">🎮 <b>MAKEN</b> PLAY</div>
<h1>🚓 POLICE CAR CHASE</h1>

  atOptions = {

<div class="hud">
  <div class="stat">SPEED <b id="speed">0</b> km/h</div>
  <div class="stat">GAP <b id="gap">—</b></div>
  <div class="stat">BUSTS <b id="busts">0</b></div>
  <div class="stat">SCORE <b id="score">0</b></div>
  <div class="stat">LIVES <b id="lives">❤️❤️❤️</b></div>

<div id="ad-bottom" style="max-width:300px;margin:6px auto;text-align:center;">
<script>
  atOptions = {
    'key' : 'ce1c8062fa346c83841a797adf119e69',
    'format' : 'iframe',

</script>
<script src="https://bicea.org/22/ce1c8062fa346c83841a797adf119e69"></script>

<script>
(function(){
"use strict";
var W=420, H=540, HORIZON=110, GROUND_Y=462;
var LANES_X=[100, 210, 320], VP_X=210, MAX_GAP=260;
var TRAFFIC=['🚙','🛻','🚕','🚐'];
/* ---------- pure logic (testable) ---------- */
function project(z){
  var t=1-z;
  return { scale: 0.12 + 0.88*t*t, y: HORIZON + (GROUND_Y-HORIZON)*t*t };
}
function laneScreenX(lane, scale){ return VP_X + (LANES_X[lane]-VP_X)*scale; }
function gapAfter(gap, playerSpeed, robberSpeed, dtSec){
  return gap + (robberSpeed - playerSpeed) * 0.28 * dtSec;
}
function gapToZ(gap){ return Math.max(0.03, Math.min(0.92, gap / MAX_GAP)); }
function bustTest(gap, dx){ return gap <= 9 && Math.abs(dx) < 52; }
function escapedTest(gap){ return gap >= MAX_GAP; }
function crashTest(playerX, carX, carZ){
  if(carZ > 0.05 || carZ < -0.04) return false;
  return Math.abs(playerX - carX) < 50;
}
function scoreFor(dist, busts){ return Math.floor(dist) + busts*300; }

/* ---------- audio ---------- */
var audioCtx=null, soundOn=true;
function beep(f,d,type,g){
  if(!soundOn) return;
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var o=audioCtx.createOscillator(), gn=audioCtx.createGain();
    o.type=type||'square'; o.frequency.value=f;
    gn.gain.value=g||0.05; gn.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+(d||0.07));
    o.connect(gn); gn.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+(d||0.07));
  }catch(e){}
}
function siren(){
  beep(700,0.12,'square',0.05);
  setTimeout(function(){ beep(950,0.12,'square',0.05); }, 110);
  setTimeout(function(){ beep(700,0.12,'square',0.05); }, 220);
}

/* ---------- state ---------- */
var cvs=document.getElementById('cv'), ctx=cvs.getContext('2d');
var el=function(id){ return document.getElementById(id); };
var playerX, traffic, robber, dist, busts, lives, speedKmh, running, spawnT, lastTs, invincibleUntil, steer;
var best=+(localStorage.getItem('makenPoliceBest')||0);
el('best').textContent=best;
function newRobber(){
  robber = { lane:1, gap:120 + Math.random()*60, weaveT:1400 + Math.random()*1200, speed:78 + busts*5 };
}
function reset(){
  playerX=LANES_X[1]; traffic=[]; dist=0; busts=0; lives=3;
  speedKmh=0; spawnT=900; invincibleUntil=0; steer=0;
  newRobber(); robber.gap=110;
}
function hud(){
  el('speed').textContent=Math.round(speedKmh);
  el('gap').textContent = robber ? Math.max(0, Math.round(robber.gap))+'m' : '—';
  el('busts').textContent=busts;
  el('lives').textContent='❤️'.repeat(Math.max(0,lives));
  var sc=scoreFor(dist, busts);
  el('score').textContent=sc;
  if(sc>best){ best=sc; localStorage.setItem('makenPoliceBest',best); }
  el('best').textContent=best;
}
function draw(now){
  ctx.fillStyle='#1d3357'; ctx.fillRect(0,0,W,HORIZON);
  ctx.fillStyle='#2c4a7c';
  for(var i=0;i<8;i++){ var bx=i*56+4, bh=20+((i*31)%28); ctx.fillRect(bx, HORIZON-bh, 36, bh); }
  ctx.fillStyle='#2b2b33';
  ctx.beginPath();
  ctx.moveTo(VP_X-20, HORIZON); ctx.lineTo(VP_X+20, HORIZON); ctx.lineTo(W-8, H); ctx.lineTo(8, H); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(VP_X-20, HORIZON); ctx.lineTo(8, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(VP_X+20, HORIZON); ctx.lineTo(W-8, H); ctx.stroke();
  ctx.strokeStyle='rgba(250,204,21,0.6)'; ctx.setLineDash([16,22]); ctx.lineDashOffset=-(dist*8 % 38);
  [LANES_X[0]+55, LANES_X[1]+55].forEach(function(bottomX){
    ctx.beginPath(); ctx.moveTo(VP_X + (bottomX-VP_X)*0.12, HORIZON); ctx.lineTo(bottomX, H); ctx.stroke();
  });
  ctx.setLineDash([]);
  /* traffic */
  traffic.forEach(function(car){
    var p=project(car.z), x=laneScreenX(car.lane, p.scale);
    ctx.font=Math.round(54*p.scale)+'px Arial'; ctx.textAlign='center';
    ctx.fillText(car.icon, x, p.y+6);
  });
  /* robber */
  if(robber){
    var z=gapToZ(robber.gap), p=project(z), x=laneScreenX(robber.lane, p.scale);
    ctx.font=Math.round(58*p.scale)+'px Arial'; ctx.textAlign='center';
    ctx.fillText('🚗', x, p.y+6);
    if(robber.gap < 60){
      ctx.fillStyle='#f87171'; ctx.font='bold '+Math.round(13*p.scale+4)+'px Arial';
      ctx.fillText('🎯 TARGET', x, p.y - 44*p.scale);
    }
  }
  /* player police car with light bar */
  var blink = running && now < invincibleUntil && Math.floor(now/120)%2===0;
  if(!blink){
    ctx.font='68px Arial'; ctx.textAlign='center';
    ctx.fillText('🚓', playerX, GROUND_Y+56);
    var lightOn = Math.floor(now/180)%2===0;
    ctx.fillStyle = lightOn ? '#ef4444' : '#3b82f6';
    ctx.beginPath(); ctx.arc(playerX, GROUND_Y-6, 5, 0, Math.PI*2); ctx.fill();
  }
  /* gap meter */
  if(robber){
    ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(60, 14, W-120, 10);
    ctx.fillStyle = robber.gap < 40 ? '#4ade80' : (robber.gap > 200 ? '#f87171' : '#fbbf24');
    ctx.fillRect(60, 14, (W-120) * (1 - Math.min(1, robber.gap/MAX_GAP)), 10);
    ctx.fillStyle='#e8ecf8'; ctx.font='bold 11px Arial'; ctx.textAlign='center';
    ctx.fillText('GAP '+Math.max(0,Math.round(robber.gap))+'m — catch at under 9m!', W/2, 38);
  }
}
function endGame(reason, now){
  running=false;
  el('msg').textContent=reason+' Final score '+scoreFor(dist,busts)+' — press START to chase again.';
  el('startBtn').textContent='▶ CHASE AGAIN';
  draw(now);
}
function crash(now){
  lives--; hud(); beep(120,0.4,'sawtooth',0.09);
  if(lives<=0){ endGame('💥 Your patrol car is wrecked!', now); return; }
  el('msg').textContent='💥 Crash! '+lives+' lives left — the robber is getting away!';
  invincibleUntil=now+2000;
  traffic = traffic.filter(function(c){ return c.z < 0.4; });
  speedKmh=Math.min(speedKmh, 40);
}
function loop(ts){
  if(!running) return;
  var dt=Math.min(40, ts-(lastTs||ts)); lastTs=ts;
  var step=dt/16.7, now=performance.now(), dtSec=dt/1000;
  dist += speedKmh*0.026*step;
  playerX += steer*4.6*step;
  playerX = Math.max(42, Math.min(W-42, playerX));
  /* robber behaviour */
  robber.weaveT -= dt;
  if(robber.weaveT<=0){
    robber.lane = Math.max(0, Math.min(2, robber.lane + (Math.random()<0.5?-1:1)));
    robber.weaveT = 1200 + Math.random()*1400;
  }
  robber.gap = gapAfter(robber.gap, speedKmh, robber.speed, dtSec);
  var rz=gapToZ(robber.gap), rp=project(rz), rx=laneScreenX(robber.lane, rp.scale);
  if(bustTest(robber.gap, playerX-rx)){
    busts++; siren();
    el('msg').textContent='🚨 BUSTED! +300 — a new robber is fleeing!';
    newRobber(); hud(); draw(now);
    requestAnimationFrame(loop); return;
  }
  if(escapedTest(robber.gap)){
    lives--; hud(); beep(160,0.4,'sawtooth',0.08);
    if(lives<=0){ endGame('🏃 The last robber escaped — the city is disappointed!', now); return; }
    el('msg').textContent='🏃 The robber escaped! '+lives+' lives left — new target ahead.';
    newRobber(); robber.gap=90;
  }
  /* traffic */
  spawnT -= dt;
  if(spawnT<=0 && speedKmh>15){
    var lane=(Math.random()*3)|0;
    traffic.push({ lane:lane, z:1.15, icon:TRAFFIC[(Math.random()*TRAFFIC.length)|0] });
    spawnT = 1150 + Math.random()*450;
  }
  var dz=(speedKmh/6800)*step;
  for(var i=traffic.length-1;i>=0;i--){
    var car=traffic[i]; car.z -= dz;
    var p=project(Math.max(0,car.z)), cx=laneScreenX(car.lane, p.scale);
    if(car.z < 0.06 && car.z > -0.12 && crashTest(playerX, cx, car.z) && now>=invincibleUntil){
      crash(now); if(!running) return;
    }
    if(car.z < -0.15) traffic.splice(i,1);
  }
  hud(); draw(now);
  requestAnimationFrame(loop);
}
var keys={};
document.addEventListener('keydown', function(e){
  keys[e.key]=true;
  if(e.key==='ArrowLeft'){ steer=-1; e.preventDefault(); }
  if(e.key==='ArrowRight'){ steer=1; e.preventDefault(); }
  if(e.key==='ArrowUp'){ speedKmh=Math.min(165, speedKmh+6); e.preventDefault(); }
  if(e.key==='ArrowDown'){ speedKmh=Math.max(0, speedKmh-9); e.preventDefault(); }
});
document.addEventListener('keyup', function(e){
  keys[e.key]=false;
  if(e.key==='ArrowLeft' && steer<0) steer = keys['ArrowRight'] ? 1 : 0;
  if(e.key==='ArrowRight' && steer>0) steer = keys['ArrowLeft'] ? -1 : 0;
});
function holdBtn(id, down, up){
  var b=el(id);
  b.addEventListener('touchstart', function(e){ e.preventDefault(); down(); }, {passive:false});
  b.addEventListener('touchend', function(e){ e.preventDefault(); if(up) up(); }, {passive:false});
  b.addEventListener('mousedown', down); b.addEventListener('mouseup', function(){ if(up) up(); });
}
holdBtn('pLeft', function(){ steer=-1; }, function(){ if(steer<0) steer=0; });
holdBtn('pRight', function(){ steer=1; }, function(){ if(steer>0) steer=0; });
holdBtn('pGas', function(){ speedKmh=Math.min(165, speedKmh+7); });
holdBtn('pBrake', function(){ speedKmh=Math.max(0, speedKmh-11); });
cvs.addEventListener('touchmove', function(e){
  var rect=cvs.getBoundingClientRect();
  playerX = Math.max(42, Math.min(W-42, (e.touches[0].clientX-rect.left)*(W/rect.width)));
  e.preventDefault();
}, {passive:false});
el('soundBtn').addEventListener('click', function(){ soundOn=!soundOn; this.textContent = soundOn ? '🔊 Sound' : '🔇 Muted'; });
el('startBtn').addEventListener('click', function(){
  reset(); running=true; lastTs=0; speedKmh=60;
  this.textContent='↻ RESTART';
  el('msg').textContent='🚨 Pursuit started — close that gap!';
  hud(); siren();
  requestAnimationFrame(loop);
});
reset(); draw(0);
if(typeof module!=='undefined') module.exports={ project:project, laneScreenX:laneScreenX, gapAfter:gapAfter, gapToZ:gapToZ, bustTest:bustTest, escapedTest:escapedTest, crashTest:crashTest, scoreFor:scoreFor };
})();
</script>
